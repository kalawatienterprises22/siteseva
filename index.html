<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteSeva - कंस्ट्रक्शन साइट का सच्चा साथी</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [lang, setLang] = useState('hi');
      const [activeTab, setActiveTab] = useState('work');

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-950 text-white border-b border-amber-500/30 sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-amber-500/20">
                  SS
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                    Site<span className="text-amber-400">Seva</span>
                    <span className="text-[10px] bg-amber-400/20 text-amber-300 font-bold px-2 py-0.5 rounded-full border border-amber-400/30">LIVE</span>
                  </h1>
                  <p className="text-[11px] text-slate-400">मशीन, ठेका, कामगार व ऑपरेटर नेटवर्क</p>
                </div>
              </div>

              {/* Language Selector */}
              <div className="flex items-center gap-2">
                <select 
                  value={lang} 
                  onChange={(e) => setLang(e.target.value)}
                  className="bg-slate-900 text-amber-300 border border-amber-500/40 text-xs px-3 py-1.5 rounded-lg focus:outline-none"
                >
                  <option value="hi">🇮🇳 हिंदी</option>
                  <option value="en">English</option>
                  <option value="hinglish">Hinglish</option>
                  <option value="mr">मराठी</option>
                  <option value="gu">ગુજરાતી</option>
                </select>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-6xl mx-auto px-4 flex gap-4 text-xs font-bold overflow-x-auto border-t border-slate-800">
              <button 
                onClick={() => setActiveTab('work')} 
                className={`py-3 border-b-2 flex items-center gap-1.5 whitespace-nowrap ${activeTab === 'work' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400 hover:text-white'}`}
              >
                📋 साइट वर्क व ठेका (Tenders)
              </button>
              <button 
                onClick={() => setActiveTab('machines')} 
                className={`py-3 border-b-2 flex items-center gap-1.5 whitespace-nowrap ${activeTab === 'machines' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400 hover:text-white'}`}
              >
                🚜 मशीन रेंटल (JCB, AJAX)
              </button>
              <button 
                onClick={() => setActiveTab('operators')} 
                className={`py-3 border-b-2 flex items-center gap-1.5 whitespace-nowrap ${activeTab === 'operators' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400 hover:text-white'}`}
              >
                🪪 ऑपरेटर व ड्राइवर (Jobs)
              </button>
              <button 
                onClick={() => setActiveTab('labour')} 
                className={`py-3 border-b-2 flex items-center gap-1.5 whitespace-nowrap ${activeTab === 'labour' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400 hover:text-white'}`}
              >
                👷 लेबर व पेटीदार गैंग
              </button>
            </div>
          </header>

          {/* Hero Banner */}
          <section className="bg-gradient-to-r from-slate-950 via-slate-900 to-amber-950 text-white py-8 px-4 border-b border-amber-500/20">

              <span className="bg-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full border border-amber-500/30 font-bold">
                भारत का पहला सम्पूर्ण कंस्ट्रक्शन नेटवर्क
              </span>
              <h2 className="text-2xl md:text-4xl font-extrabold leading-tight">

              <p className="text-slate-300 text-xs md:text-sm max-w-xl mx-auto">

                  <h3 className="font-bold text-slate-900 text-lg">चल रहे काम और टेंडर्स (Live Leads)</h3>
                  <button className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow-md">

                  </button>
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:border-amber-400 transition-all">
                    <div className="flex justify-between items-start">
                      <span className="text-[11px] bg-blue-50 text-blue-700 font-bold px-2.5 py-1 rounded-md">RCC & Concrete Work</span>

                    <h4 className="font-bold text-slate-900 mt-2 text-base">कंक्रीट कैनाल व रिटेनिंग वॉल लाइनिंग (3.5 KM)</h4>
                    <p className="text-xs text-slate-500 mt-1">📍 सोनभद्र / मिर्जापुर, UP • साइट शुरू: तत्काल</p>
                    <p className="text-xs text-slate-600 mt-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100">

                      <span className="text-xs font-extrabold text-amber-600">बजट: ₹22/Sq.Ft</span>

                    <h4 className="font-bold text-slate-900 mt-2 text-base">कमर्शियल प्लाजा शटरिंग कार्य (45,000 Sq.Ft)</h4>

                    </p>
                    <div className="mt-4 pt-3 border-t flex justify-between items-center">
                      <span className="text-xs text-slate-500">पोस्टकर्ता: RK बिल्डर्स</span>
                      <button className="bg-slate-900 text-amber-400 text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-slate-800">
                        रेट / कोटेशन डालें
                      </button>
                    </div>
                  </div>
                </div>
              </div>

            {activeTab === 'machines' && (

                <div className="grid md:grid-cols-3 gap-4">

                    <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">उपलब्ध (Available)</span>
                    <h4 className="font-bold text-slate-900 mt-2">Ajax Fiori Argo 4000 (SLCM)</h4>
                    <p className="text-xs text-slate-500">4.0 Cum कंक्रीट मिक्सर • 2022 मॉडल</p>
                    <div className="mt-3 bg-slate-50 p-2 rounded-lg text-xs space-y-1">
                      <p className="font-bold text-slate-800">किराया: ₹1,40,000 / महीना</p>
                      <p className="text-slate-500">ऑपरेटर: साथ में उपलब्ध • डीजल साइट पर</p>
                    </div>
                    <button className="w-full mt-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-xl text-xs">
                      📞 डायरेक्ट कॉल करें
                    </button>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">उपलब्ध (Available)</span>
                    <h4 className="font-bold text-slate-900 mt-2">JCB 3DX Super Backhoe Loader</h4>
                    <p className="text-xs text-slate-500">4WD • 2023 मॉडल</p>
                    <div className="mt-3 bg-slate-50 p-2 rounded-lg text-xs space-y-1">
                      <p className="font-bold text-slate-800">किराया: ₹950 / घंटा (या ₹75,000/माह)</p>
                      <p className="text-slate-500">अनुभवी ऑपरेटर सहित</p>
                    </div>
                    <button className="w-full mt-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-xl text-xs">
                      📞 डायरेक्ट कॉल करें
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'operators' && (
              <div className="space-y-4">
                <h3 className="font-bold text-slate-900 text-lg">प्रमाणित ऑपरेटर व ड्राइवर (Verified Profiles)</h3>
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div className="flex justify-between">
                      <h4 className="font-bold text-slate-900">रामेश्वर यादव (Ajax & JCB ऑपरेटर)</h4>
                      <span className="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded">HMV Verified</span>
                    </div>
                    <p className="text-xs text-slate-500 mt-1">अनुभव: 6 साल • DL No: UP-65-20180029XXX</p>
                    <p className="text-xs text-slate-700 mt-2">अपेक्षित सैलरी: ₹24,000 / महीना (रहना + खाना)</p>
                    <button className="w-full mt-3 bg-slate-900 text-amber-400 font-bold py-2 rounded-xl text-xs">
                      ऑपरेटर से संपर्क करें
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'labour' && (
              <div className="space-y-4">
                <h3 className="font-bold text-slate-900 text-lg">लेबर सप्लायर व पेटी ठेकेदार डायरेक्टरी</h3>
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <h4 className="font-bold text-slate-900">माँ विंध्यवासिनी कंस्ट्रक्शन गैंग</h4>
                    <p className="text-xs text-slate-500">गैंग साइज: 25 कुशल मिस्त्री व लेबर</p>
                    <p className="text-xs text-slate-700 mt-2">विशेषज्ञता: शटरिंग, सरिया बाइंडिंग और आरसीसी स्लैब कास्टिंग</p>
                    <button className="w-full mt-3 bg-slate-900 text-white font-bold py-2 rounded-xl text-xs">
                      रेट व अवेलेबिलिटी पूछें
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-slate-950 text-slate-400 py-6 border-t border-slate-800 text-center text-xs">
            <p className="font-bold text-slate-300">SiteSeva (साइटसेवा) © 2026</p>
            <p className="mt-1">हर साइट का सच्चा साथी — मशीन, ठेका और कामगार</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
