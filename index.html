<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteSeva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* विशुद्ध CSS भाषा इंजन */
    .view-en, .view-hinglish, .view-mr, .view-gu { display: none; }

    body:has(#lang-en:checked) .view-en { display: inline-block !important; }
    body:has(#lang-en:checked) .view-hi { display: none !important; }

    body:has(#lang-hinglish:checked) .view-hinglish { display: inline-block !important; }
    body:has(#lang-hinglish:checked) .view-hi { display: none !important; }

    body:has(#lang-mr:checked) .view-mr { display: inline-block !important; }
    body:has(#lang-mr:checked) .view-hi { display: none !important; }

    body:has(#lang-gu:checked) .view-gu { display: inline-block !important; }
    body:has(#lang-gu:checked) .view-hi { display: none !important; }

    /* एक्टिव बटन का पीला रंग */
    body:has(#lang-hi:checked) label[for="lang-hi"],
    body:has(#lang-en:checked) label[for="lang-en"],
    body:has(#lang-hinglish:checked) label[for="lang-hinglish"],
    body:has(#lang-mr:checked) label[for="lang-mr"],
    body:has(#lang-gu:checked) label[for="lang-gu"] {
      background-color: #f59e0b !important;
      color: #020617 !important;
      font-weight: 900 !important;
    }

    /* mParivahan प्योर CSS ट्रिगर - 100% फेल-प्रूफ */
    #apiResultBox { display: none; }
    body:has(#trigger-verify:checked) #apiResultBox { display: block !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- लैंग्वेज इनपुट -->
  <input type="radio" name="site_lang" id="lang-hi" class="hidden" checked>
  <input type="radio" name="site_lang" id="lang-en" class="hidden">
  <input type="radio" name="site_lang" id="lang-hinglish" class="hidden">
  <input type="radio" name="site_lang" id="lang-mr" class="hidden">
  <input type="radio" name="site_lang" id="lang-gu" class="hidden">

  <!-- mParivahan CSS ट्रिगर (कोई जावास्क्रिप्ट नहीं चाहिए) -->
  <input type="checkbox" id="trigger-verify" class="hidden">

  <!-- Header -->
  <header class="bg-slate-950 text-white p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center font-black text-slate-950 text-lg">SS</div>
      <div>
        <div class="flex items-center gap-1">
          <span class="text-xl font-black text-amber-400">SiteSeva</span>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-1.5 py-0.5 rounded border border-emerald-500/30">API CONNECTED</span>
        </div>
        <p class="text-[10px] text-slate-400">
          <span class="view-hi">मशीन, ठेका व वेरीफाइड ऑपरेटर</span>
          <span class="view-en">Machinery, Contracts & Operators</span>
          <span class="view-hinglish">Machine, Theka aur Operators</span>
          <span class="view-mr">मशीनरी, कंत्राट आणि ऑपरेटर</span>
          <span class="view-gu">મશીનરી, કોન્ટ્રાક્ટ અને ઓપરેટર</span>
        </p>
      </div>
    </div>
    
    <!-- लैंग्वेज टैब्स -->
    <div class="flex gap-1.5 text-xs font-bold flex-wrap">
      <label for="lang-hi" class="cursor-pointer px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700">हिंदी</label>
      <label for="lang-en" class="cursor-pointer px-2.5 py-1 rounded bg-slate-800 text
