<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteSeva | Heavy Machinery, Tenders & Workforce Network</title>
<style>
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --primary:#0f172a;
  --primary-light:#1e293b;
  --accent:#f59e0b;
  --accent-hover:#d97706;
  --accent-soft:#fef3c7;
  --success:#10b981;
  --success-soft:#d1fae5;
  --text-main:#0f172a;
  --text-muted:#64748b;
  --border:#e2e8f0;
  --radius:12px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 6px 18px -4px rgba(15,23,42,0.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-main);line-height:1.5}

/* Header & Nav */
header{background:linear-gradient(135deg, #020617 0%, #0f172a 100%);color:white;padding:28px 16px;text-align:center;border-bottom:3px solid var(--accent);position:relative}
.header-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);color:var(--accent);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.header-title{margin:0;font-size:32px;font-weight:900;letter-spacing:-0.5px;color:white}
.header-title span{color:var(--accent)}
.header-sub{margin:6px 0 0;font-size:13px;color:#94a3b8}

nav{background:var(--surface);padding:10px 16px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:90;box-shadow:var(--shadow-sm)}
.lang-select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:700;background:#f1f5f9;color:var(--primary);cursor:pointer;outline:none}

/* Buttons */
button,.btn{border:0;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all 0.15s ease}
.btn-primary{background:var(--primary);color:var(--accent)}
.btn-primary:hover{background:var(--primary-light)}
.btn-accent{background:var(--accent);color:#020617}
.btn-accent:hover{background:var(--accent-hover)}
.btn-green{background:var(--success);color:white}
