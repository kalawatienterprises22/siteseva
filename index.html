  <header class="bg-slate-950 text-white p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center font-black text-slate-950 text-lg">SS</div>
      <div>
        <div class="flex items-center gap-1">

          <span class="text-[10px] bg-amber-400/20 text-amber-300 font-bold px-1.5 py-0.5 rounded">LIVE</span>
        </div>
        <p id="ui-tagline" class="text-[10px] text-slate-400"></p>
      </div>
    </div>
    
    <!-- 5 Language Buttons -->
    <div class="flex gap-1.5 text-xs font-bold flex-wrap" id="lang-buttons-container"></div>
  </header>

  <!-- Hero Section -->
  <div class="bg-gradient-to-r from-slate-950 via-slate-900 to-amber-950 text-white py-8 px-4 text-center border-b border-amber-500/20">
    <span id="ui-hero-badge" class="bg-amber-500/20 text-amber-400 text-xs px-3 py-1 rounded-full border border-amber-500/30 font-bold"></span>
    <h2 id="ui-hero-title" class="text-2xl md:text-3xl font-extrabold mt-3"></h2>
    <p id="ui-hero-desc" class="text-slate-300 text-xs max-w-xl mx-auto mt-2"></p>
    
    <div class="mt-5 flex flex-wrap justify-center gap-3">
      <button onclick="openModal()" id="ui-btn-post" class="bg-amber-500 text-slate-950 px-5 py-2.5 rounded-lg text-xs font-black shadow-lg hover:bg-amber-400"></button>
      <a href="tel:919999999999" id="ui-btn-call" class="bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-lg text-xs font-bold"></a>
      <a href="https://wa.me/919999999999" target="_blank" id="ui-btn-wa" class="bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-xs font-bold"></a>
    </div>
  </div>

  <main class="max-w-5xl mx-auto p-4 space-y-8 flex-1 w-full">

    <!-- mParivahan Verification Tool -->
    <section class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-md border border-slate-700">
      <div class="flex flex-col md:flex-row justify-between md:items-center gap-2 mb-3">
        <div>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/30">mParivahan / Vahan API Engine</span>
          <h3 id="ui-parivahan-title" class="text-base font-extrabold text-amber-400 mt-1"></h3>
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-3">
        <select id="verifyType" class="bg-slate-950 text-white border border-slate-700 rounded-lg p-2.5 text-xs font-bold">
          <option value="DL">ड्राइविंग लाइसेंस (DL Verification)</option>
          <option value="RC">मशीन RC (Vehicle RC)</option>
        </select>
        <input type="text" id="verifyNumber" placeholder="उदा. DL-0420110012345 या UP65AB1234" class="bg-slate-950 text-white border border-slate-700 rounded-lg p-2.5 text-xs uppercase" />
        <button onclick="runVerify()" id="ui-btn-verify" class="bg-amber-500 text-slate-950 font-black text-xs py-2.5 rounded-lg hover:bg-amber-400"></button>
      </div>

      <div id="verifyResult" class="hidden mt-3 p-3 bg-slate-950 rounded-lg border border-slate-700 text-xs"></div>
    </section>

    <!-- 1. Live Leads Section -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h3 id="ui-leads-heading" class="font-extrabold text-slate-900 text-lg"></h3>
        <span id="ui-leads-count" class="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-1 rounded"></span>
      </div>
      <div class="grid md:grid-cols-2 gap-4" id="leads-list"></div>
    </section>

    <!-- 2. Machinery Rental Section -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h3 id="ui-mach-heading" class="font-extrabold text-slate-900 text-lg"></h3>
      </div>
      <div class="grid md:grid-cols-2 gap-4" id="mach-list"></div>
    </section>

    <!-- 3. Workforce Section -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h3 id="ui-work-heading" class="font-extrabold text-slate-900 text-lg"></h3>
      </div>
      <div class="grid md:grid-cols-2 gap-4" id="work-list"></div>
    </section>

  </main>

  <!-- Modal / Form: Post Requirement -->
  <div id="postModal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b">
        <h3 class="font-bold text-slate-900 text-base" id="ui-modal-title"></h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      </div>
      <form onsubmit="handleFormSubmit(event)" class="space-y-3 mt-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">प्रकार / Type</label>
          <select id="pCat" class="w-full border p-2 rounded-lg">
            <option value="machine">मशीन रेंटल (Machinery Rental)</option>
            <option value="lead">साइट का ठेका / टेंडर (Work Lead)</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">टाइटल / विवरण</label>
          <input type="text" id="pTitle" required placeholder="उदा. Ajax Fiori SLCM किराए पर उपलब्ध या कैनाल काम" class="w-full border p-2 rounded-lg" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="pLoc" required placeholder="लोकेशन (उदा. मिर्जापुर, UP)" class="border p-2 rounded-lg" />
          <input type="text" id="pRate" required placeholder="किराया / रेट (उदा. ₹1.40 लाख/माह)" class="border p-2 rounded-lg" />
        </div>
        <input type="tel" id="pPhone" required placeholder="मोबाइल नंबर (उदा. 9876543210)" class="w-full border p-2 rounded-lg" />
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-lg mt-2" id="ui-modal-submit"></button>
      </form>
    </div>
  </div>

    <p class="font-bold text-slate-300">SiteSeva © 2026</p>

    function handleFormSubmit(e) {
      e.preventDefault();
      var title = document.getElementById('pTitle').value;
      var loc = document.getElementById('pLoc').value;
      var rate = document.getElementById('pRate').value;
      var phone = document.getElementById('pPhone').value;
      var cat = document.getElementById('pCat').value;

      if (cat === 'machine') {
        DataStore.machinery.unshift({
          title: title,
          subtitle: "User Posted • Location: " + loc,
          rate: { hi: rate, en: rate, hinglish: rate, mr: rate, gu: rate },
          desc: { hi: "संपर्क: " + phone, en: "Contact: " + phone, hinglish: "Contact: " + phone, mr: "संपर्क: " + phone, gu: "સંપર્ક: " + phone },

          tag: "Live Requirement",

          company: "Direct Owner",
          phone: phone
        });

      alert("सफलतापूर्वक लाइव पोस्ट हो गया!");
      closeModal();
      renderPage();
    }
