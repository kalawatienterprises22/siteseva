    .card { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 15px; border: 1px solid #334155; }

    .btn-v { background: #f59e0b; color: #020617; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .lead { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
