<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>SiteSeva - Live mParivahan Verification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; }
    .box { max-width: 550px; margin: auto; }
    .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f59e0b; padding-bottom: 10px; margin-bottom: 20px; }
    .card { background: #1e293b; padding: 18px; border-radius: 8px; border: 1px solid #334155; }
    select, input, .btn { width: 100%; padding: 10px; margin: 6px 0; border-radius: 5px; font-size: 13px; }
    select, input { background: #0b0f19; color: #fff; border: 1px solid #475569; text-transform: uppercase; }
    .btn { background: #f59e0b; color: #000; font-weight: bold; border: none; cursor: pointer; }
    .res { display: none; background: #020617; border: 1px solid #10b981; padding: 14px; border-radius: 6px; margin-top: 15px; font-size: 13px; line-height: 1.7; }
    .loading { display: none; text-align: center; color: #f59e0b; margin-top: 10px; font-weight: bold; }
  </style>
  <script>
    async function verifyLive() {
      var type = document.getElementById('docType').value;
      var num = document.getElementById('docNum').value.trim();
      var resBox = document.getElementById('resBox');
      var loader = document.getElementById('loader');

      if (!num) {
        alert("कृपया नंबर दर्ज करें!");
        return;
      }

      loader.style.display = 'block';
      resBox.style.display = 'none';

      try {
        var resp = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: type, number: num })
        });

        var data = await resp.json();
        loader.style.display = 'none';
        resBox.style.display = 'block';

        if (data.data) {
          var d = data.data;
          if (type === 'RC') {
            resBox.innerHTML = '<div style="color:#10b981; font-weight:bold; margin-bottom:6px;">✅ Live Vahan RC Verified</div>' +
              '<div><strong>गाड़ी नंबर:</strong> <span style="color:#f59e0b;">' + (d.rc_number || num.toUpperCase()) + '</span></div>' +
              '<div><strong>मालिक का नाम:</strong> ' + (d.owner_name || 'N/A') + '</div>' +
              '<div><strong>मेकर / मॉडल:</strong> ' + (d.maker_description || d.maker_model || 'N/A') + '</div>' +
              '<div><strong>वाहन श्रेणी (Class):</strong> <span style="color:#38bdf8;">' + (d.vehicle_category || d.vehicle_class || 'N/A') + '</span></div>' +
              '<div><strong>पंजीकृत RTO:</strong> ' + (d.registered_at || 'N/A') + '</div>' +
              '<div><strong>फिटनेस वैधता:</strong> ' + (d.fitness_upto || d.rc_expiry_date || 'Active') + '</div>';
          } else {
            resBox.innerHTML = '<div style="color:#10b981; font-weight:bold; margin-bottom:6px;">✅ Live Sarathi DL Verified</div>' +
              '<div><strong>लाइसेंस नंबर:</strong> <span style="color:#f59e0b;">' + (d.dl_number || num.toUpperCase()) + '</span></div>' +
              '<div><strong>धारक का नाम:</strong> ' + (d.name || 'N/A') + '</div>' +
              '<div><strong>अधिकृत श्रेणी (COV):</strong> <span style="color:#38bdf8;">' + JSON.stringify(d.cov_details || d.class_of_vehicle || 'LMV / MCWG') + '</span></div>' +
              '<div><strong>जारीकर्ता RTO:</strong> ' + (d.issuing_authority || 'N/A') + '</div>' +
              '<div><strong>वैधता:</strong> ' + (d.validity ? d.validity.non_transport : (d.nt_validity || 'Valid')) + '</div>';
          }
        } else {
          resBox.innerHTML = '<div style="color:#ef4444;">⚠️ रिकॉर्ड नहीं मिला: ' + (data.message || 'Error fetching data') + '</div>';
        }
      } catch (err) {
        loader.style.display = 'none';
        resBox.style.display = 'block';
        resBox.innerHTML = '<div style="color:#ef4444;">सर्वर से संपर्क नहीं हो सका।</div>';
      }
    }
  </script>
</head>
<body>
  <div class="box">
    <div class="nav">
      <h2 style="color:#f59e0b;">SiteSeva</h2>
      <span style="font-size:12px; color:#94a3b8;">लाइव mParivahan सत्यापन</span>
    </div>

    <div class="card">
      <label style="font-size:12px; font-weight:bold;">दस्तावेज़ प्रकार चुनें:</label>
      <select id="docType">
        <option value="RC">गाड़ी / मशीन RC (Live Vahan)</option>
        <option value="DL">ऑपरेटर लाइसेंस DL (Live Sarathi)</option>
      </select>

      <label style="font-size:12px; font-weight:bold; margin-top:8px; display:block;">नंबर दर्ज करें:</label>
      <input type="text" id="docNum" placeholder="उदा. JH10CU8403 या DL नंबर">

      <button class="btn" onclick="verifyLive()">🔍 लाइव सरकारी डेटा फेच करें</button>

      <div class="loading" id="loader">⏳ mParivahan सर्वर से लाइव डेटा लोड हो रहा है...</div>
      <div class="res" id="resBox"></div>
    </div>
  </div>
</body>
</html>
